<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAG Store</title>
    <link rel="stylesheet" href="style4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h2>RAG<span>.</span></h2>
            <p>Selamat datang! Silakan masuk ke akun Anda.</p>

            <div class="social-login">
                <button type="button" class="social-btn google" onclick="prosesLoginSosial('google-user@gmail.com', 'Google')">
                    <img src="google.jpeg" alt="Google"> Google  
                </button>
                <button type="button" class="social-btn facebook" onclick="prosesLoginSosial('fb-user@facebook.com', 'Facebook')">
                    <i class="fab fa-facebook-f" style="margin-right: 8px;"></i> Facebook
                </button>
            </div>

            <div class="divider"><span>atau masuk dengan email</span></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="user@email.com" required>
                </div>
                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Minimal 8 karakter" minlength="8" required>
                </div>
                <button type="submit" class="btn-login">Masuk ke Toko</button>
            </form>

            <p class="signup-link">Baru di RAG? <a href="belajar1.html">Daftar Akun</a></p>
        </div>
    </div>

    <script src="data5.js"></script>
</body>
</html>
